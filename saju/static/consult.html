<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운결 · 도령의 상담실</title>
<meta name="description" content="연애, 재회, 궁합, 직업·재물, 반려동물, 고민 상담. 운결 도령이 묻고, 네 사주로 답한다.">
<meta name="theme-color" content="#0b0910">
<meta property="og:type" content="website">
<meta property="og:title" content="운결 · 도령의 상담실">
<meta property="og:description" content="네 이야기를 듣고, 네 사주로 답한다. 상담은 무료.">
<meta property="og:image" content="__PUBLIC_URL__/img/dory.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/toon.css">
<link rel="stylesheet" href="/chalk.css">
<style>
  /* 상담실: 도령과 손님이 주고받는 대화 */
  .room { max-width: 600px; margin: 0 auto; padding: 0 16px 60px; }
  .topbar { position: static; }  /* 위에 붙는 건 대화방 머리 하나만 */
  /* 카톡처럼: 위에 작은 대화방 머리, 도령은 동그란 프로필 + 말풍선 */
  .room-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 12px 0; margin-bottom: 6px; background: #000; border-bottom: 1px solid var(--line); }
  .room-head img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
  .room-head h1 { margin: 0; font: 400 19px "Song Myung", serif; color: #f6e7c4; }
  .room-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
  .msg { display: flex; gap: 8px; margin: 14px 0 0; align-items: flex-start; animation: rise .4s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .msg .ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
  .msg .body { min-width: 0; max-width: calc(100% - 90px); }
  .msg .who { margin: 0 0 4px 2px; font-size: 12px; color: var(--ink-2); }
  .msg.cont { margin-top: 5px; }
  .msg.cont .ava { visibility: hidden; height: 0; }
  .msg.cont .who { display: none; }
  .msg .say { padding: 10px 14px; background: #1c1c1c; border: 0; border-radius: 4px 16px 16px 16px;
    font: 400 16px/1.65 "Noto Sans KR", sans-serif; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .say h3 { margin: 0 0 4px; font: 700 12px "Noto Sans KR", sans-serif; letter-spacing: .1em; color: var(--accent-2); }
  .msg.me { justify-content: flex-end; }
  .msg.me { margin-top: 14px; }
  .msg.me .say { max-width: 78%; background: #ffe45c; color: #000; border-radius: 16px 4px 16px 16px; font: 500 15px/1.6 "Noto Sans KR", sans-serif; }
  .way .msg { margin: 0 0 10px; }
  .msg.wait .say { color: var(--ink-3); }
  .dots::after { content: "…"; animation: dots 1.2s steps(3) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.2em; } }
  .ans { margin: 10px 0 6px 48px; animation: rise .5s .15s ease-out both; }
  .ans .chips { justify-content: flex-start; margin: 4px 0; }
  .ans .chip { border: 0; padding: 0; background: none; }
  .ans .chip span { font-size: 15px; padding: 9px 15px; }
  .ans .chip:hover span { border-color: var(--gold); color: var(--ink); }
  .ans .qcard { max-width: none; margin-top: 4px; }
  .ans textarea { width: 100%; min-height: 90px; }
  .ans .btn { font: 400 18px "Black Han Sans", sans-serif; border-radius: 12px; background: #ffe45c; color: #000; }
  .ans .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .ans .check { color: var(--ink-3); text-align: left; }
  .room-head .pno { margin: 14px 0 0; font: 700 12px "Noto Sans KR", sans-serif; letter-spacing: .3em; color: var(--accent-2); }
  #page-pdf .offer { margin-left: 0; }
  .offer { margin: 18px 0 0 50px; padding: 16px; border: 1px solid rgba(217,178,106,.5); border-radius: 12px;
    background: linear-gradient(180deg, #1d1522, #120e17); animation: rise .6s ease-out both; }
  .offer h3 { margin: 0 0 6px; font: 400 20px "Song Myung", serif; color: #f6e7c4; }
  .offer .way { margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #100d15; }
  .offer .way b { color: var(--gold); }
  .offer .way.gift { border-color: rgba(217,178,106,.6); }
  .offer .btn { width: 100%; margin-top: 8px; }
  .offer .ready { color: var(--gold); font-weight: 700; }
  .offer input, .offer .check { margin-top: 6px; }
  .offer .done { color: #f6e7c4; }
  .deep { margin: 18px 0 0 50px; max-width: none; width: auto; animation: rise .6s ease-out both; }
  .deep .kicker { opacity: 1; }
  .peek { margin: 16px 0 0 50px; padding: 16px; border-radius: 10px; border: 1px solid rgba(217,178,106,.45);
    background: linear-gradient(180deg, #19141f, #110d15); animation: rise .6s ease-out both; }
  .peek .kicker { opacity: 1; color: var(--gold); }
  .pch { padding: 10px 0; border-top: 1px solid var(--line); }
  .pch:first-of-type { border-top: 0; }
  .pch .pno2 { font: 700 11px "Noto Sans KR", sans-serif; letter-spacing: .15em; color: var(--accent-2); margin-right: 8px; }
  .pch b { font: 400 17px "Song Myung", serif; color: #f6e7c4; }
  .pch p { margin: 6px 0 0; font: 400 16px/1.7 "Song Myung", serif; color: var(--ink); }
  .pch.more p { color: var(--ink-2); font: 400 14px/1.6 "Noto Sans KR", sans-serif; }
  .pch.more p.hint { color: var(--gold); }
  .pchars { float: right; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .peeknote { margin: 10px 0 0; padding: 10px; border-radius: 8px; background: rgba(217,178,106,.07); color: var(--ink-2); font-size: 13px; line-height: 1.6; }
  @media (max-width: 420px) { .peek { margin-left: 0; } }
  .deep .blurred { white-space: pre-wrap; }
  @media (max-width: 420px) { .deep { margin-left: 0; } }
  @media (max-width: 420px) { .ans, .offer { margin-left: 0; } }
</style>
</head>
<body class="apply">
<div class="curtain on"><div class="cseal">運</div><p class="ctitle">셋째 장 · 도령의 상담실</p></div>
<button id="snd" aria-label="목소리 켜기" hidden style="display:none">🔇</button>
<header class="topbar">
  <a class="brand" href="/" aria-label="운결 처음 화면으로"><span class="seal">運</span>운결</a>
</header>
<main class="room" id="app">
  <div class="room-head">
    <img src="/img/toon2/ava.jpg" alt="운결 도령">
    <div>
      <h1>운결 도령 · 상담실</h1>
      <p>네 사주로 답해 줄게. 상담은 무료야.</p>
    </div>
  </div>
  <div id="chat" aria-live="polite"></div>
  <!-- 넷째 장: 대화가 끝나면 페이지가 넘어가 PDF 받기 -->
  <section id="page-pdf" hidden>
    <div class="pagehead"><p class="pno">넷째 장</p><h2>네 이름으로 쓴 PDF</h2></div>
    <div class="pdfprev">
      <div class="pdfstrip">
        <figure><img src="/img/pdf/cover.jpg" alt="PDF 표지"><figcaption>표지 · 네 이름</figcaption></figure>
        <figure><img src="/img/pdf/open.jpg" alt="여는 말과 사주표, 차례"><figcaption>여는 말 · 사주 네 기둥 · 차례</figcaption></figure>
        <figure><img src="/img/pdf/chapter.jpg" alt="장마다 핵심 요약과 풀이"><figcaption>장마다 핵심 + 깊은 풀이</figcaption></figure>
        <figure><img src="/img/pdf/closing.jpg" alt="맺는 말과 서명"><figcaption>맺는 말 · 도령 서명</figcaption></figure>
      </div>
    </div>
    <div id="pdfbox"></div>
    <button class="backlink" id="back-chat" type="button">← 상담 다시 보기</button>
  </section>
</main>
<footer class="foot">
  <p>운결은 명리학을 바탕으로 자기 이해와 방향 설정을 돕는 서비스이며, 의료·법률·투자 자문을 대신하지 않습니다. 등장인물은 AI로 만든 가상 캐릭터입니다.</p>
  <p>마음이 많이 힘드시다면 자살예방상담전화 109 · 정신건강위기상담 1577-0199</p>
</footer>
<script src="/form.js"></script>
<script src="/consult.js"></script>
</body>
</html>
